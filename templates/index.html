<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you like me?</title>
    <!-- JS Canvas Confetti library for fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ffeef2; 
            overflow: hidden;
            position: relative;
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
            min-width: 320px; 
            max-width: 400px; 
            position: relative;
            z-index: 2;
        }
        .card-img { width: 180px; height: 180px; object-fit: contain; margin-bottom: 1rem; border-radius: 12px; }
        .btn-group { 
            margin-top: 1.5rem; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 12px; 
            min-height: 50px;
            position: relative;
        }
        button { 
            padding: 10px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            color: white; 
            transition: transform 0.2s, opacity 0.2s, background-color 0.2s; 
        }
        button:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-yes { background-color: #ff6b81; z-index: 2; }
        .btn-no { background-color: #a4b0be; z-index: 10; }
        .btn-next { background-color: #70a1ff; }
        .hidden { display: none !important; }
        
        /* Music Control Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ffb6c1;
            color: #ff6b81;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .custom-input {
            width: 85%;
            padding: 12px 15px;
            margin-top: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            outline: none;
            font-size: 15px;
            text-align: center;
        }
        textarea.custom-input {
            height: 90px;
            resize: none;
            text-align: left;
        }
        .custom-input:focus {
            border-color: #ff6b81;
        }
    </style>
</head>
<body>

    <!-- Background Music (Royalty Free Cute BGM) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=cute-creepy-music-box-113222.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Control Button -->
    <button class="music-btn" onclick="toggleMusic()">
        <span id="music-icon">🎵</span> <span id="music-text">Music Off</span>
    </button>

    <!-- Page Start (Enter Name) -->
    <div id="page-start" class="card">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Welcome ❤️</h1>
        <p>Please enter your name first</p>
        
        <input type="text" id="user-name" class="custom-input" placeholder="Type your name here..." autocomplete="off">
        
        <div class="btn-group">
            <button class="btn-next" onclick="startSurvey()">Next</button>
        </div>
    </div>

    <!-- Page 1 -->
    <div id="page-1" class="card hidden">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Do you like me?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button id="p1-yes" class="btn-yes" onclick="answerPage1('Yes', '2')">Yes</button>
            <button id="p1-no" class="btn-no" onmouseover="handleNoHover(this, 'p1-yes')" onclick="handleNoClick(this, 'p1-yes', 'answerPage1')">No</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page-2" class="card hidden">
        <img src="/happy.png" alt="Happy" class="card-img">
        <h1>I like you too ❤️</h1>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage('3')">Next</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page-3" class="card hidden">
        <img src="/flower.gif" alt="Flower" class="card-img">
        <h1>Will you be my girlfriend?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button id="p3-yes" class="btn-yes" onclick="answerPage3('Yes', 'message')">Yes</button>
            <button id="p3-no" class="btn-no" onmouseover="handleNoHover(this, 'p3-yes')" onclick="handleNoClick(this, 'p3-yes', 'answerPage3')">No</button>
        </div>
    </div>

    <!-- Page Message -->
    <div id="page-message" class="card hidden">
        <img src="/happy.png" alt="Message" class="card-img">
        <h1>Anything you'd like to tell me? 💌</h1>
        <p>Feel free to leave a message for me</p>
        
        <textarea id="user-message" class="custom-input" placeholder="Type your message here... (optional)"></textarea>
        
        <div class="btn-group">
            <button class="btn-yes" onclick="submitFinalData('4')">Send Message</button>
        </div>
    </div>

    <!-- Page 4 -->
    <div id="page-4" class="card hidden">
        <img src="/happy.png" alt="Love" class="card-img">
        <h1>Yay! ❤️</h1>
        <h2>See you soon! Baby</h2>
        <div class="btn-group">
            <button class="btn-next" onclick="resetApp()">Back to Start</button>
        </div>
    </div>

    <!-- Page End -->
    <div id="page-end" class="card hidden">
        <img src="/bear.png" alt="Bear" class="card-img">
        <h1>Ok, Thank you</h1>
    </div>

    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/djep3pyy8c55t";
        let savedName = "";
        let page1Answer = "-";
        let page3Answer = "-";
        let yesScale = 1.0;
        let noAttemptCount = 0; // ตัวนับจำนวนครั้งที่พยายามกด No

        // Music toggle
        const bgMusic = document.getElementById('bg-music');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                document.getElementById('music-text').innerText = "Music Off";
                document.getElementById('music-icon').innerText = "🔇";
            } else {
                bgMusic.play().catch(e => console.log("Music play blocked:", e));
                document.getElementById('music-text').innerText = "Music On";
                document.getElementById('music-icon').innerText = "🎵";
            }
            isPlaying = !isPlaying;
        }

        function startSurvey() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput === "") {
                alert("Please enter your name before proceeding.");
                return;
            }
            savedName = nameInput;
            
            if (!isPlaying) {
                toggleMusic();
            }
            
            goToPage('1');
        }

        // จัดการเมื่อเลื่อนเมาส์/แตะโดนปุ่ม No
        function handleNoHover(btn, yesBtnId) {
            // หนีเฉพาะ 2 ครั้งแรกเท่านั้น
            if (noAttemptCount < 2) {
                moveNoBtn(btn, yesBtnId);
            }
        }

        // จัดการเมื่อคลิกปุ่ม No
        function handleNoClick(btn, yesBtnId, callbackName) {
            if (noAttemptCount < 2) {
                // ครั้งที่ 1 และ 2 จะหนี
                moveNoBtn(btn, yesBtnId);
            } else {
                // ครั้งที่ 3 เป็นต้นไปให้ยอมให้กด No ได้เลย
                if (callbackName === 'answerPage1') {
                    answerPage1('No', 'end');
                } else if (callbackName === 'answerPage3') {
                    answerPage3('No', 'end');
                }
            }
        }

        // ย้ายตำแหน่งปุ่ม No
        function moveNoBtn(btn, yesBtnId) {
            noAttemptCount++;
            
            if (noAttemptCount < 3) {
                btn.style.position = "fixed";
                
                const padding = 50;
                const maxX = window.innerWidth - btn.offsetWidth - padding;
                const maxY = window.innerHeight - btn.offsetHeight - padding;

                const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                btn.style.left = randomX + "px";
                btn.style.top = randomY + "px";

                // ขยายปุ่ม Yes
                yesScale += 0.2;
                const yesBtn = document.getElementById(yesBtnId);
                if (yesBtn) {
                    yesBtn.style.transform = `scale(${yesScale})`;
                }
            } else {
                // พอกด/โดนครั้งที่ 3 ย้ายปุ่มกลับมาตำแหน่งเดิมให้กดง่ายๆ
                btn.style.position = "static";
            }
        }

        function resetRunawayButtons() {
            yesScale = 1.0;
            noAttemptCount = 0; // รีเซ็ตตัวนับ
            ['p1-no', 'p3-no'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.style.position = "static";
                }
            });
            ['p1-yes', 'p3-yes'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.style.transform = "scale(1.0)";
                }
            });
        }

        function answerPage1(ans, nextPageId) {
            page1Answer = ans;
            resetRunawayButtons();
            if (nextPageId === 'end') {
                submitFinalData('end');
            } else {
                goToPage(nextPageId);
            }
        }

        function answerPage3(ans, nextPageId) {
            page3Answer = ans;
            resetRunawayButtons();
            if (nextPageId === 'end') {
                submitFinalData('end');
            } else {
                goToPage(nextPageId);
            }
        }

        function submitFinalData(nextPageId) {
            const messageInput = document.getElementById('user-message').value.trim();
            const finalMessage = messageInput !== "" ? messageInput : "-";

            let combinedAnswer = "Page 1: " + page1Answer;
            if (page3Answer !== "-") {
                combinedAnswer += " | Page 3: " + page3Answer;
            }

            goToPage(nextPageId);

            if (nextPageId === '4') {
                launchConfetti();
            }

            fetch(SHEETDB_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: {
                        "name": savedName,
                        "answer": combinedAnswer,
                        "message": finalMessage,
                        "timestamp": "'" + new Date().toLocaleString('en-US')
                    }
                })
            }).catch(err => console.error("Error:", err));
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff6b81', '#ffb6c1', '#ffffff', '#ff4757']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff6b81', '#ffb6c1', '#ffffff', '#ff4757']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function goToPage(pageId) {
            const pages = document.querySelectorAll('.card');
            pages.forEach(page => page.classList.add('hidden'));
            
            if (pageId === 'start') {
                document.getElementById('page-start').classList.remove('hidden');
            } else if (pageId === 'message') {
                document.getElementById('page-message').classList.remove('hidden');
            } else {
                document.getElementById('page-' + pageId).classList.remove('hidden');
            }
        }

        function resetApp() {
            document.getElementById('user-name').value = "";
            document.getElementById('user-message').value = "";
            savedName = "";
            page1Answer = "-";
            page3Answer = "-";
            resetRunawayButtons();
            goToPage('start');
        }
    </script>
</body>
</html>
