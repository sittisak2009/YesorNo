<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Flask Web App</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; min-width: 300px; }
        .btn-group { margin-top: 1.5rem; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; color: white; transition: opacity 0.2s; }
        .btn-yes { background-color: #4CAF50; }
        .btn-no { background-color: #f44336; }
        .btn-next { background-color: #2196F3; }
        button:hover { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Page 1 -->
    <div id="page-1" class="card">
        <h1>Do you like me?</h1>
        <p>Page 1</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="goToPage(2)">Yes</button>
            <!-- กด No จะวิ่งไปแสดงหน้า Ok Thank you (Page 2) -->
            <button class="btn-no" onclick="goToPage(2)">No</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page-2" class="card hidden">
        <h1>Ok Thank you</h1>
        <p>I'm grateful as well</p>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage(3)">Next</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page-3" class="card hidden">
        <h1>Page 3</h1>
        <p>Will you be my girlfriend?</p>
        <div class="btn-group">
            <!-- กด Yes จะไปหน้าตอบรับ (Page 4) -->
            <button class="btn-yes" onclick="goToPage(4)">Yes</button>
            <!-- กด No จะวนกลับไปหน้า Ok Thank you (Page 2) -->
            <button class="btn-no" onclick="goToPage(2)">No</button>
        </div>
    </div>

    <!-- Page 4 (หน้าปลายทางเมื่อกด Yes ในหน้า 3) -->
    <div id="page-4" class="card hidden">
        <h1>Yay! ❤️</h1>
        <p>See you soon!</p>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage(1)">Back to Start</button>
        </div>
    </div>

    <script>
        function goToPage(pageNumber) {
            // ซ่อนทุกหน้า
            document.getElementById('page-1').classList.add('hidden');
            document.getElementById('page-2').classList.add('hidden');
            document.getElementById('page-3').classList.add('hidden');
            document.getElementById('page-4').classList.add('hidden');

            // แสดงหน้าที่ต้องการ
            document.getElementById('page-' + pageNumber).classList.remove('hidden');
        }
    </script>
</body>
</html>
