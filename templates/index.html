<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you like me?</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffeef2; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; min-width: 320px; max-width: 400px; }
        .card-img { width: 180px; height: 180px; object-fit: contain; margin-bottom: 1rem; border-radius: 12px; }
        .btn-group { margin-top: 1.5rem; display: flex; justify-content: center; gap: 12px; }
        button { padding: 10px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; color: white; transition: transform 0.2s, opacity 0.2s; }
        button:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-yes { background-color: #ff6b81; }
        .btn-no { background-color: #a4b0be; }
        .btn-next { background-color: #70a1ff; }
        .hidden { display: none; }
        
        .custom-input {
            width: 85%;
            padding: 12px 15px;
            margin-top: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            outline: none;
            font-size: 15px;
            text-align: center;
        }
        textarea.custom-input {
            height: 90px;
            resize: none;
            text-align: left;
        }
        .custom-input:focus {
            border-color: #ff6b81;
        }
    </style>
</head>
<body>

    <!-- Page Start (Enter Name) -->
    <div id="page-start" class="card">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Welcome ❤️</h1>
        <p>Please enter your name first</p>
        
        <input type="text" id="user-name" class="custom-input" placeholder="Type your name here..." autocomplete="off">
        
        <div class="btn-group">
            <button class="btn-next" onclick="startSurvey()">Next</button>
        </div>
    </div>

    <!-- Page 1 -->
    <div id="page-1" class="card hidden">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Do you like me?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="answerPage1('Yes', '2')">Yes</button>
            <button class="btn-no" onclick="answerPage1('No', 'end')">No</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page-2" class="card hidden">
        <img src="/happy.png" alt="Happy" class="card-img">
        <h1>I like you too ❤️</h1>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage('3')">Next</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page-3" class="card hidden">
        <img src="/flower.gif" alt="Flower" class="card-img">
        <h1>Will you be my girlfriend?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="answerPage3('Yes', 'message')">Yes</button>
            <button class="btn-no" onclick="answerPage3('No', 'end')">No</button>
        </div>
    </div>

    <!-- Page Message -->
    <div id="page-message" class="card hidden">
        <img src="/happy.png" alt="Message" class="card-img">
        <h1>Anything you'd like to tell me? 💌</h1>
        <p>Feel free to leave a message for me</p>
        
        <textarea id="user-message" class="custom-input" placeholder="Type your message here... (optional)"></textarea>
        
        <div class="btn-group">
            <button class="btn-yes" onclick="submitFinalData('4')">Send Message</button>
        </div>
    </div>

    <!-- Page 4 -->
    <div id="page-4" class="card hidden">
        <img src="/happy.png" alt="Love" class="card-img">
        <h1>Yay! ❤️</h1>
        <h2>See you soon! Baby</h2>
        <div class="btn-group">
            <button class="btn-next" onclick="resetApp()">Back to Start</button>
        </div>
    </div>

    <!-- Page End -->
    <div id="page-end" class="card hidden">
        <img src="/bear.png" alt="Bear" class="card-img">
        <h1>Ok, Thank you</h1>
    </div>

    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/djep3pyy8c55t";
        let savedName = "";
        let page1Answer = "-";
        let page3Answer = "-";

        function startSurvey() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput === "") {
                alert("Please enter your name before proceeding.");
                return;
            }
            savedName = nameInput;
            goToPage('1');
        }

        // เก็บคำตอบของ Page 1
        function answerPage1(ans, nextPageId) {
            page1Answer = ans;
            if (nextPageId === 'end') {
                submitFinalData('end');
            } else {
                goToPage(nextPageId);
            }
        }

        // เก็บคำตอบของ Page 3
        function answerPage3(ans, nextPageId) {
            page3Answer = ans;
            if (nextPageId === 'end') {
                submitFinalData('end');
            } else {
                goToPage(nextPageId);
            }
        }

        // รวมคำตอบทั้ง Page 1 และ Page 3 ส่งเข้า SheetDB
        function submitFinalData(nextPageId) {
            const messageInput = document.getElementById('user-message').value.trim();
            const finalMessage = messageInput !== "" ? messageInput : "-";

            let combinedAnswer = "Page 1: " + page1Answer;
            if (page3Answer !== "-") {
                combinedAnswer += " | Page 3: " + page3Answer;
            }

            goToPage(nextPageId);

            fetch(SHEETDB_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: {
                        "name": savedName,
                        "answer": combinedAnswer,
                        "message": finalMessage,
                        "timestamp": new Date().toLocaleString('en-US')
                    }
                })
            }).catch(err => console.error("Error:", err));
        }

        function goToPage(pageId) {
            const pages = document.querySelectorAll('.card');
            pages.forEach(page => page.classList.add('hidden'));
            
            if (pageId === 'start') {
                document.getElementById('page-start').classList.remove('hidden');
            } else if (pageId === 'message') {
                document.getElementById('page-message').classList.remove('hidden');
            } else {
                document.getElementById('page-' + pageId).classList.remove('hidden');
            }
        }

        function resetApp() {
            document.getElementById('user-name').value = "";
            document.getElementById('user-message').value = "";
            savedName = "";
            page1Answer = "-";
            page3Answer = "-";
            goToPage('start');
        }
    </script>
</body>
</html>
