<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you like me?</title>
    <!-- JS Canvas Confetti library for fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ffeef2; 
            overflow: hidden;
            position: relative;
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
            min-width: 320px; 
            max-width: 400px; 
            position: relative;
            z-index: 2;
        }
        .card-img { width: 180px; height: 180px; object-fit: contain; margin-bottom: 1rem; border-radius: 12px; }
        .btn-group { 
            margin-top: 1.5rem; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 12px; 
            min-height: 50px;
            position: relative;
        }
        button { 
            padding: 10px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            color: white; 
            transition: transform 0.2s, opacity 0.2s, background-color 0.2s; 
        }
        button:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-yes { background-color: #ff6b81; z-index: 2; }
        .btn-no { background-color: #a4b0be; z-index: 10; }
        .btn-next { background-color: #70a1ff; }
        .hidden { display: none !important; }

        .custom-input {
            width: 85%;
            padding: 12px 15px;
            margin-top: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            outline: none;
            font-size: 15px;
            text-align: center;
        }
        textarea.custom-input {
            height: 90px;
            resize: none;
            text-align: left;
        }
        .custom-input:focus {
            border-color: #ff6b81;
        }

        /* ซ่อนตัวเล่นเพลง YouTube ไว้เบื้องหลัง */
        #bg-music-container {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- ซ่อนเครื่องเล่นเพลง YouTube ไว้หลังเว็บ -->
    <div id="bg-music-container"></div>

    <!-- Page Start (Enter Name) -->
    <div id="page-start" class="card">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Welcome ❤️</h1>
        <p>Please enter your name first</p>
        
        <input type="text" id="user-name" class="custom-input" placeholder="Type your name here..." autocomplete="off">
        
        <div class="btn-group">
            <button class="btn-next" onclick="startSurvey()">Next</button>
        </div>
    </div>

    <!-- Page 1: Do you like me? -->
    <div id="page-1" class="card hidden">
        <img src="/panda.gif" alt="Panda" class="card-img">
        <h1>Do you like me?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button id="p1-yes" class="btn-yes" onclick="answerPage1('Yes', '2')">Yes</button>
            <button id="p1-no" class="btn-no" onmouseover="handleNoHover(this, 'p1-yes')" onclick="handleNoClick(this, 'p1-yes')">No</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page-2" class="card hidden">
        <img src="/happy.png" alt="Happy" class="card-img">
        <h1>I like you too ❤️</h1>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage('3')">Next</button>
        </div>
    </div>

    <!-- Page 3: Will you be my girlfriend? -->
    <div id="page-3" class="card hidden">
        <img src="/flower.gif" alt="Flower" class="card-img">
        <h1>Will you be my girlfriend?</h1>
        <p>Website by Fluke</p>
        <div class="btn-group">
            <button id="p3-yes" class="btn-yes" onclick="answerPage3('Yes', 'message')">Yes</button>
            <button id="p3-no" class="btn-no" onclick="answerPage3('No', 'message')">No</button>
        </div>
    </div>

    <!-- Page Message -->
    <div id="page-message" class="card hidden">
        <img src="/happy.png" alt="Message" class="card-img">
        <h1>Anything you'd like to tell me? 💌</h1>
        <p>Feel free to leave a message for me</p>
        
        <textarea id="user-message" class="custom-input" placeholder="Type your message here... (optional)"></textarea>
        
        <div class="btn-group">
            <button class="btn-yes" onclick="submitFinalData('4')">Send Message</button>
        </div>
    </div>

    <!-- Page 4 -->
    <div id="page-4" class="card hidden">
        <img src="/happy.png" alt="Love" class="card-img">
        <h1>Yay! ❤️</h1>
        <h2>See you soon! Baby</h2>
        <div class="btn-group">
            <button class="btn-next" onclick="resetApp()">Back to Start</button>
        </div>
    </div>

    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/djep3pyy8c55t";
        // YouTube Video ID (ตัวอย่างรหัสหลัง v= ของลิงก์ YouTube เช่น irCD8WvvS88)
        const youtubeVideoId = "iUOyhJ0eZun"; 

        let savedName = "";
        let page1Answer = "-";
        let page3Answer = "-";
        let yesScale = 1.0;
        let noAttemptCount = 0;

        function startSurvey() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (nameInput === "") {
                alert("Please enter your name before proceeding.");
                return;
            }
            savedName = nameInput;
            goToPage('1');
        }

        // จัดการเมื่อเลื่อนเมาส์/แตะโดนปุ่ม No (เฉพาะหน้า 1)
        function handleNoHover(btn, yesBtnId) {
            if (noAttemptCount < 2) {
                moveNoBtn(btn, yesBtnId);
            }
        }

        // จัดการเมื่อคลิกปุ่ม No (เฉพาะหน้า 1)
        function handleNoClick(btn, yesBtnId) {
            if (noAttemptCount < 2) {
                moveNoBtn(btn, yesBtnId);
            } else {
                answerPage1('No', '2');
            }
        }

        // ย้ายตำแหน่งปุ่ม No (เฉพาะหน้า 1)
        function moveNoBtn(btn, yesBtnId) {
            noAttemptCount++;
            
            if (noAttemptCount < 3) {
                btn.style.position = "fixed";
                
                const padding = 50;
                const maxX = window.innerWidth - btn.offsetWidth - padding;
                const maxY = window.innerHeight - btn.offsetHeight - padding;

                const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                btn.style.left = randomX + "px";
                btn.style.top = randomY + "px";

                yesScale += 0.2;
                const yesBtn = document.getElementById(yesBtnId);
                if (yesBtn) {
                    yesBtn.style.transform = `scale(${yesScale})`;
                }
            } else {
                btn.style.position = "static";
            }
        }

        function resetRunawayButtons() {
            yesScale = 1.0;
            noAttemptCount = 0;
            const btn = document.getElementById('p1-no');
            if (btn) {
                btn.style.position = "static";
            }
            const yesBtn = document.getElementById('p1-yes');
            if (yesBtn) {
                yesBtn.style.transform = "scale(1.0)";
            }
        }

        function answerPage1(ans, nextPageId) {
            page1Answer = ans;
            resetRunawayButtons();
            goToPage(nextPageId);
        }

        function answerPage3(ans, nextPageId) {
            page3Answer = ans;
            if (ans === 'No') {
                // แจ้งเตือนข้อความภาษาอังกฤษ
                alert("I'd like you to listen to this song.");
                // เริ่มเล่นเพลง YouTube ในพื้นหลัง
                playBackgroundYouTube();
            }
            goToPage(nextPageId);
        }

        function playBackgroundYouTube() {
            const container = document.getElementById('bg-music-container');
            // สร้าง iframe ของ YouTube ให้เล่นอัตโนมัติ (autoplay=1)
            container.innerHTML = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        function submitFinalData(nextPageId) {
            const messageInput = document.getElementById('user-message').value.trim();
            const finalMessage = messageInput !== "" ? messageInput : "-";

            let combinedAnswer = "Page 1: " + page1Answer + " | Page 3: " + page3Answer;

            goToPage(nextPageId);

            if (nextPageId === '4') {
                launchConfetti();
            }

            fetch(SHEETDB_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: {
                        "name": savedName,
                        "answer": combinedAnswer,
                        "message": finalMessage,
                        "timestamp": "'" + new Date().toLocaleString('en-US')
                    }
                })
            }).catch(err => console.error("Error:", err));
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff6b81', '#ffb6c1', '#ffffff', '#ff4757']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff6b81', '#ffb6c1', '#ffffff', '#ff4757']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function goToPage(pageId) {
            const pages = document.querySelectorAll('.card');
            pages.forEach(page => page.classList.add('hidden'));
            
            if (pageId === 'start') {
                document.getElementById('page-start').classList.remove('hidden');
            } else if (pageId === 'message') {
                document.getElementById('page-message').classList.remove('hidden');
            } else {
                document.getElementById('page-' + pageId).classList.remove('hidden');
            }
        }

        function resetApp() {
            document.getElementById('user-name').value = "";
            document.getElementById('user-message').value = "";
            document.getElementById('bg-music-container').innerHTML = ""; // หยุดเพลงเมื่อเริ่มใหม่
            savedName = "";
            page1Answer = "-";
            page3Answer = "-";
            resetRunawayButtons();
            goToPage('start');
        }
    </script>
</body>
</html>
