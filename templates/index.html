<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Flask Web App</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; min-width: 300px; }
        .btn-group { margin-top: 1.5rem; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; color: white; transition: opacity 0.2s; }
        .btn-yes { background-color: #4CAF50; }
        .btn-no { background-color: #f44336; }
        .btn-next { background-color: #2196F3; }
        button:hover { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Page 1 -->
    <div id="page-1" class="card">
        <h1>Do you like me?</h1>
        <p>Page 1</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="goToPage('2')">Yes</button>
            <!-- กด No ไปหน้าจบทันที (ไม่มีปุ่ม Next) -->
            <button class="btn-no" onclick="goToPage('end')">No</button>
        </div>
    </div>

    <!-- Page 2 (เมื่อกด Yes จากหน้า 1) -->
    <div id="page-2" class="card hidden">
        <h1>I'm grateful as well</h1>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage('3')">Next</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page-3" class="card hidden">
        <h1>Will you be my girlfriend?</h1>
        <p>Page 3</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="goToPage('4')">Yes</button>
            <!-- กด No ไปหน้าจบทันที (ไม่มีปุ่ม Next) -->
            <button class="btn-no" onclick="goToPage('end')">No</button>
        </div>
    </div>

    <!-- Page 4 (เมื่อกด Yes จากหน้า 3) -->
    <div id="page-4" class="card hidden">
        <h1>Yay! ❤️</h1>
        <p>See you soon!</p>
        <div class="btn-group">
            <button class="btn-next" onclick="goToPage('1')">Back to Start</button>
        </div>
    </div>

    <!-- Page End (หน้าแสดงเมื่อกด No จะไม่มีปุ่ม Next ให้ไปต่อ) -->
    <div id="page-end" class="card hidden">
        <h1>Ok Thank you</h1>
    </div>

    <script>
        function goToPage(pageId) {
            // ซ่อนทุกหน้า
            const pages = document.querySelectorAll('.card');
            pages.forEach(page => page.classList.add('hidden'));

            // แสดงเฉพาะหน้าที่เลือก
            document.getElementById('page-' + pageId).classList.remove('hidden');
        }
    </script>
</body>
</html>
